apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcart-frontend-deployment
  namespace: default
  labels:
    app: smartcart-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartcart-frontend
  template:
    metadata:
      labels:
        app: smartcart-frontend
    spec:
      containers:
      - name: frontend-pwa
        image: smartcart/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: smartcart-frontend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: smartcart-frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartcart-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
  - host: smartcart.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: smartcart-api-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smartcart-frontend-service
            port:
              number: 80
