apiVersion: v1
kind: ConfigMap
metadata:
  name: smartcart-config
  namespace: default
data:
  DJANGO_ENV: "production"
  DJANGO_DEBUG: "False"
  CORS_ALLOWED_ORIGINS: "https://smartcart.example.com"
  DEFAULT_GATEWAY_VERSION: "v2"
  CACHE_TTL_SECONDS: "3600"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcart-api-deployment
  namespace: default
  labels:
    app: smartcart-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartcart-api
  template:
    metadata:
      labels:
        app: smartcart-api
    spec:
      containers:
      - name: api-gateway
        image: smartcart/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: smartcart-config
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smartcart-api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: smartcart-api
  ports:
  - port: 8000
    targetPort: 8000
