name: SmartCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Checks & Migrations Validation
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run DRF Test Suite
        run: |
          cd backend
          python manage.py test apps.authentication apps.users apps.products apps.recommendations

  frontend-build:
    name: Frontend Build & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle (Vite)
        run: |
          cd frontend
          npm run build
